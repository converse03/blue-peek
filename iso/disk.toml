[[customizations.filesystem]]
mountpoint = "/"
minsize = "20 GiB"

# bootc-image-builder has its own default kernel args (visible via its
# --no-default-kernel-args flag) and does not read the image's
# /usr/lib/bootc/kargs.d/*.toml drop-ins when building qcow2/raw/iso
# images. Kernel args for VM/disk builds must be set here instead.
[customizations.kernel]
append = "rhgb quiet"
